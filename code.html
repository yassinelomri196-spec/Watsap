<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ادخل رمز الإضافة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap">
<style>
:root{--bg:#effaf3;--card:#ffffff;--ink:#0f2a1c;--muted:#5b7568;--green:#1faa59;--green-d:#168a46;--line:#cfe5d7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a13;--card:#13261c;--ink:#e8f6ee;--muted:#9bb8a8;--line:#254636}}
:root[data-theme="dark"]{--bg:#0c1a13;--card:#13261c;--ink:#e8f6ee;--muted:#9bb8a8;--line:#254636}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;padding:20px}
main{width:100%;max-width:400px;background:var(--card);border-radius:28px;padding:36px 24px 28px;text-align:center;box-shadow:0 10px 40px rgba(20,90,50,.12)}
.logo{width:112px;height:112px;margin:0 auto 20px;display:block}
h1{font-size:26px;font-weight:800;margin:0 0 20px}
input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);text-align:center;direction:ltr}
input::placeholder{color:var(--muted);direction:rtl}
input:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-color:var(--green)}
button{width:100%;margin-top:14px;font:inherit;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--green);color:#fff;cursor:pointer}
button:hover{background:var(--green-d)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{min-height:24px;margin:12px 0 0;font-size:16px;font-weight:700;color:#e02020}
#code{letter-spacing:.35em;font-size:22px;font-weight:700}
#code::placeholder{letter-spacing:normal;font-size:18px;font-weight:500}
</style>
</head>
<body>
<main>
<svg class="logo" viewBox="0 0 112 112" role="img" aria-label="واتساب"><circle cx="56" cy="56" r="56" fill="#25d366"/><path d="M56 24a32 32 0 0 0-27.6 48.1L25 87l15.3-3.3A32 32 0 1 0 56 24z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M45 42c-1.5 0-3.5 1-4.5 3.5-1.3 3.3 0 8 4.5 13.5 5.3 6.4 11.5 9.3 15.8 9.4 3 .1 5.7-1.8 6.4-4.2.3-1 .3-1.8 0-2-.5-.4-4.2-2.2-5-2.5-.8-.3-1.4-.2-1.9.5l-2.2 2.7c-.5.6-1 .7-1.8.4-2.6-1.3-6.700-3.800-9.200-8.100-.4-.8-.1-1.300.4-1.800l1.700-2c.4-.5.500-1 .2-1.700l-3-6.600c-.3-.6-.8-.9-1.600-.9z" fill="#fff"/></svg>
<h1>ادخل رمز الإضافة</h1>
<input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="اكتب الرمز" aria-label="رمز الإضافة">
<p id="err" class="err" role="alert"></p>
<button id="ok" type="button">تأكيد</button>
</main>
<script>
function clean(el){el.value=el.value.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;}).replace(/\D/g,'').slice(0,6);}
var code=document.getElementById('code'),err=document.getElementById('err');
function next(){
  if(code.value.length<6){err.textContent='اكتب الرمز المكوّن من 6 أرقام.';return;}
  location.href='code2.html';
}
code.addEventListener('input',function(){clean(code);err.textContent='';});
code.addEventListener('keydown',function(e){if(e.key==='Enter')next();});
document.getElementById('ok').addEventListener('click',next);
</script>
</body>
</html>
