pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="اكتب الرمز" aria-label="رمز الإضافة">
<p id="err2" class="err" role="alert"></p>
<button id="ok2" type="button">تأكيد</button>
</main>

<script>
function $(i){return document.getElementById(i);}
function digits(s){return s.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;});}
function clean(el){el.value=digits(el.value).replace(/\D/g,'').slice(0,6);}
var s1=$('s1'),s2=$('s2'),s3=$('s3');
var logo=document.querySelector('#s1 .logo');
$('l2').appendChild(logo.cloneNode(true));
$('l3').appendChild(logo.cloneNode(true));

/* الصفحة 1: رقم الهاتف */
var phone=$('phone');
function go(){
  var v=digits(phone.value).replace(/[\s\-()]/g,'');
  if(!/^\d{6,15}$/.test(v)){$('msg').textContent='اكتب رقم هاتف صحيح.';return;}
  s1.hidden=true;s2.hidden=false;$('code').focus();
}
$('go').addEventListener('click',go);
phone.addEventListener('keydown',function(e){if(e.key==='Enter')go();});

/* الصفحة 2: إدخال الرمز ثم تأكيد */
var code=$('code');
function next(){
  if(code.value.length<6){$('err').textContent='اكتب الرمز المكوّن من 6 أرقام.';return;}
  s2.hidden=true;s3.hidden=false;$('code2').focus();
}
code.addEventListener('input',function(){clean(code);$('err').textContent='';});
code.addEventListener('keydown',function(e){if(e.key==='Enter')next();});
$('ok').addEventListener('click',next);

/* الصفحة 3: تظهر عبارة الرمز غير صحيح */
var code2=$('code2');
function check(){
  if(code2.value.length<6){$('err2').textContent='اكتب الرمز المكوّن من 6 أرقام.';return;}
  $('err2').textContent='الرمز الذي أدخلتم غير صحيح';
  code2.value='';code2.focus();
}
code2.addEventListener('input',function(){clean(code2);$('err2').textContent='';if(code2.value.length===6)check();});
code2.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
$('ok2').addEventListener('click',check);
